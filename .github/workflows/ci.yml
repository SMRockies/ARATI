name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      POSTGRES_DB: arati_erp
      POSTGRES_USER: arati
      POSTGRES_PASSWORD: ci-password
      DATABASE_URL: postgresql://arati:ci-password@localhost:5432/arati_erp?schema=public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: arati_erp
          POSTGRES_USER: arati
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arati -d arati_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm verify
