services:
  postgres:
    image: postgres:16-alpine
    container_name: arati-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arati_erp}
      POSTGRES_USER: ${POSTGRES_USER:-arati}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arati} -d ${POSTGRES_DB:-arati_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
